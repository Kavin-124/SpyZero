  <line x1="50" y1="64" x2="50" y2="72" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="46" x2="32" y2="46" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="46" x2="76" y2="46" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
</svg>